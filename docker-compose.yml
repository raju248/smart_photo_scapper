services:
  backend:
    build:
      context: ./backend
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
